<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14131F">
<title>Mixtape — เพลงของฉัน</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
  :root{
    --bg:#14131F;
    --surface:#1E1B2E;
    --surface-2:#26223A;
    --line:#3A3552;
    --amber:#E8A33D;
    --teal:#4FD1C5;
    --cream:#F2EFE9;
    --dim:#8A85A3;
    --danger:#E8704F;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(ellipse at top, #1A1830 0%, var(--bg) 55%);
    color:var(--cream);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    min-height:100vh;
    display:flex;
    justify-content:center;
    padding:24px 16px 48px;
  }
  .app{
    width:100%;
    max-width:440px;
  }
  .eyebrow{
    font-family:"SF Mono",SFMono-Regular,Menlo,Consolas,monospace;
    font-size:12px;
    letter-spacing:.18em;
    color:var(--dim);
    text-transform:uppercase;
    margin:0 0 4px 2px;
  }
  h1{
    font-size:26px;
    margin:0 0 20px 2px;
    font-weight:800;
    letter-spacing:-.01em;
  }
  .accent{color:var(--amber);}

  /* Cassette */
  .cassette{
    background:linear-gradient(180deg,var(--surface) 0%, #191629 100%);
    border:1px solid var(--line);
    border-radius:20px;
    padding:22px 20px 18px;
    box-shadow:0 20px 40px -20px rgba(0,0,0,.6);
  }
  .reels{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:6px 18px 14px;
  }
  .reel-wrap{display:flex;flex-direction:column;align-items:center;gap:6px;}
  .reel{
    width:64px;height:64px;border-radius:50%;
    border:5px solid var(--reel-color,var(--amber));
    background:var(--bg);
    display:flex;align-items:center;justify-content:center;
    position:relative;
    animation:spin 2.2s linear infinite paused;
  }
  .reel::before{
    content:"";
    width:16px;height:16px;border-radius:50%;
    background:var(--reel-color,var(--amber));
  }
  .reel::after{
    content:"";
    position:absolute; inset:10px;
    border-radius:50%;
    border:2px dashed var(--line);
  }
  .reel.left{--reel-color:var(--amber);}
  .reel.right{--reel-color:var(--teal);}
  .app.playing .reel{animation-play-state:running;}
  @keyframes spin{to{transform:rotate(360deg);}}

  .label{
    background:var(--bg);
    border-radius:10px;
    padding:14px 16px;
    text-align:center;
    min-height:56px;
    display:flex;flex-direction:column;justify-content:center;
    gap:2px;
  }
  .track-title{font-weight:700;font-size:16px;line-height:1.3;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .track-sub{font-size:12px;color:var(--dim);
    font-family:"SF Mono",SFMono-Regular,Menlo,Consolas,monospace;letter-spacing:.04em;}

  .counter-row{
    display:flex;justify-content:space-between;align-items:center;
    margin-top:14px;font-family:"SF Mono",SFMono-Regular,Menlo,Consolas,monospace;
    font-size:11px;color:var(--dim);
  }
  .tape-track{
    height:6px;background:var(--line);border-radius:99px;margin:6px 0 0;
    position:relative;cursor:pointer;
  }
  .tape-fill{
    position:absolute;left:0;top:0;bottom:0;border-radius:99px;
    background:linear-gradient(90deg,var(--amber),var(--teal));
    width:0%;
  }
  input[type=range]{
    -webkit-appearance:none;appearance:none;width:100%;height:6px;
    background:transparent;margin:0;position:relative;z-index:2;
  }
  input[type=range]::-webkit-slider-thumb{
    -webkit-appearance:none;width:14px;height:14px;border-radius:50%;
    background:var(--cream);margin-top:-4px;box-shadow:0 0 0 3px rgba(0,0,0,.3);
  }
  input[type=range]::-webkit-slider-runnable-track{height:6px;background:transparent;}
  .seek-wrap{position:relative;margin-top:6px;}
  .seek-wrap .tape-track{position:absolute;left:0;right:0;top:50%;transform:translateY(-50%);z-index:1;}

  .controls{
    display:flex;align-items:center;justify-content:center;gap:22px;
    margin-top:16px;
  }
  .btn-round{
    background:var(--surface-2);border:1px solid var(--line);color:var(--cream);
    width:44px;height:44px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;cursor:pointer;
    transition:transform .12s ease, background .12s ease;
  }
  .btn-round:active{transform:scale(.92);}
  .btn-play{
    width:60px;height:60px;background:linear-gradient(160deg,var(--amber),#C97D22);
    color:#14131F;border:none;
  }
  .btn-round svg{width:18px;height:18px;}
  .btn-play svg{width:22px;height:22px;}

  .vol-row{display:flex;align-items:center;gap:10px;margin-top:16px;}
  .vol-row svg{width:16px;height:16px;color:var(--dim);flex:none;}
  .vol-row input{flex:1;}

  /* Playlist */
  .section-head{
    display:flex;justify-content:space-between;align-items:baseline;
    margin:28px 2px 10px;
  }
  .section-head h2{font-size:14px;letter-spacing:.06em;text-transform:uppercase;color:var(--dim);margin:0;font-weight:700;}
  .count-pill{font-family:"SF Mono",SFMono-Regular,Menlo,Consolas,monospace;font-size:12px;color:var(--dim);}

  .add-btn{
    width:100%;
    border:1.5px dashed var(--line);
    background:transparent;
    color:var(--dim);
    border-radius:14px;
    padding:16px;
    font-size:14px;
    display:flex;align-items:center;justify-content:center;gap:8px;
    cursor:pointer;
    margin-bottom:14px;
    transition:border-color .15s, color .15s;
  }
  .add-btn:hover, .add-btn:active{border-color:var(--amber);color:var(--amber);}
  .add-btn svg{width:16px;height:16px;}

  .track-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px;}
  .track-item{
    display:flex;align-items:center;gap:12px;
    background:var(--surface);border:1px solid var(--line);
    border-radius:12px;padding:10px 12px;cursor:pointer;
  }
  .track-item.active{border-color:var(--amber);background:var(--surface-2);}
  .track-num{
    font-family:"SF Mono",SFMono-Regular,Menlo,Consolas,monospace;
    font-size:12px;color:var(--dim);width:20px;flex:none;text-align:center;
  }
  .track-item.active .track-num{color:var(--amber);}
  .track-info{flex:1;min-width:0;}
  .track-name{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .track-dur{font-size:11px;color:var(--dim);font-family:"SF Mono",SFMono-Regular,Menlo,Consolas,monospace;}
  .del-btn{
    background:none;border:none;color:var(--dim);cursor:pointer;
    padding:6px;flex:none;display:flex;
  }
  .del-btn:hover{color:var(--danger);}
  .del-btn svg{width:16px;height:16px;}

  .empty{
    text-align:center;color:var(--dim);font-size:13px;
    padding:28px 10px;border:1px solid var(--line);border-radius:12px;
  }

  input[type=file]{display:none;}

  .toast{
    position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);
    background:var(--surface-2);border:1px solid var(--line);color:var(--cream);
    padding:10px 18px;border-radius:99px;font-size:13px;
    opacity:0;transition:opacity .25s ease, transform .25s ease;
    pointer-events:none;
  }
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
</style>
</head>
<body>
<div class="app" id="app">
  <p class="eyebrow">มิกซ์เทปส่วนตัว · เก็บในเครื่องนี้เท่านั้น</p>
  <h1>เพลงของ<span class="accent">ฉัน</span></h1>

  <div class="cassette">
    <div class="reels">
      <div class="reel-wrap"><div class="reel left"></div></div>
      <div class="reel-wrap"><div class="reel right"></div></div>
    </div>
    <div class="label">
      <div class="track-title" id="trackTitle">ยังไม่มีเพลง</div>
      <div class="track-sub" id="trackSub">เพิ่มเพลงจากเครื่องด้านล่าง</div>
    </div>

    <div class="seek-wrap">
      <div class="tape-track"><div class="tape-fill" id="tapeFill"></div></div>
      <input type="range" id="seek" min="0" max="100" value="0" step="0.1">
    </div>
    <div class="counter-row">
      <span id="curTime">00:00</span>
      <span id="durTime">00:00</span>
    </div>

    <div class="controls">
      <button class="btn-round" id="prevBtn" aria-label="เพลงก่อนหน้า">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 6h2v12H6zM20 6v12l-8.5-6z"/></svg>
      </button>
      <button class="btn-round btn-play" id="playBtn" aria-label="เล่น/หยุด">
        <svg id="playIcon" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
      </button>
      <button class="btn-round" id="nextBtn" aria-label="เพลงถัดไป">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M16 6h2v12h-2zM4 6v12l8.5-6z"/></svg>
      </button>
    </div>

    <div class="vol-row">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M3 10v4h4l5 5V5L7 10H3zm13.5 2A4.5 4.5 0 0 0 14 7.97v8.05a4.5 4.5 0 0 0 2.5-3.02z"/></svg>
      <input type="range" id="volume" min="0" max="1" step="0.01" value="1">
    </div>
  </div>

  <div class="section-head">
    <h2>เพลย์ลิสต์</h2>
    <span class="count-pill" id="countPill">0 เพลง</span>
  </div>

  <button class="add-btn" id="addBtn">
    <svg viewBox="0 0 24 24" fill="currentColor"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6z"/></svg>
    เพิ่มเพลงจากเครื่อง (mp3, m4a, wav…)
  </button>
  <input type="file" id="fileInput" accept="audio/*" multiple>

  <ul class="track-list" id="trackList"></ul>
  <div class="empty" id="emptyState">ยังไม่มีเพลงในเครื่อง กดปุ่มด้านบนเพื่อเพิ่มเพลงที่ดาวน์โหลดไว้ในมือถือ</div>
</div>

<div class="toast" id="toast"></div>

<script>
// ---------- IndexedDB ----------
const DB_NAME = 'mixtapeDB';
const STORE = 'tracks';
let db;

function openDB(){
  return new Promise((resolve, reject)=>{
    const req = indexedDB.open(DB_NAME, 1);
    req.onupgradeneeded = (e)=>{
      const _db = e.target.result;
      if(!_db.objectStoreNames.contains(STORE)){
        const store = _db.createObjectStore(STORE, {keyPath:'id', autoIncrement:true});
        store.createIndex('addedAt','addedAt');
      }
    };
    req.onsuccess = (e)=>resolve(e.target.result);
    req.onerror = (e)=>reject(e.target.error);
  });
}

function addTrack(track){
  return new Promise((resolve,reject)=>{
    const tx = db.transaction(STORE,'readwrite');
    const req = tx.objectStore(STORE).add(track);
    req.onsuccess = ()=>resolve(req.result);
    req.onerror = (e)=>reject(e.target.error);
  });
}

function getAllTracks(){
  return new Promise((resolve,reject)=>{
    const tx = db.transaction(STORE,'readonly');
    const req = tx.objectStore(STORE).getAll();
    req.onsuccess = ()=>resolve(req.result.sort((a,b)=>a.addedAt-b.addedAt));
    req.onerror = (e)=>reject(e.target.error);
  });
}

function deleteTrack(id){
  return new Promise((resolve,reject)=>{
    const tx = db.transaction(STORE,'readwrite');
    const req = tx.objectStore(STORE).delete(id);
    req.onsuccess = ()=>resolve();
    req.onerror = (e)=>reject(e.target.error);
  });
}

// ---------- State ----------
let tracks = [];
let currentIndex = -1;
let objectUrl = null;
const audio = new Audio();
audio.preload = 'metadata';

const appEl = document.getElementById('app');
const trackListEl = document.getElementById('trackList');
const emptyStateEl = document.getElementById('emptyState');
const countPillEl = document.getElementById('countPill');
const trackTitleEl = document.getElementById('trackTitle');
const trackSubEl = document.getElementById('trackSub');
const playBtn = document.getElementById('playBtn');
const playIcon = document.getElementById('playIcon');
const seekEl = document.getElementById('seek');
const tapeFillEl = document.getElementById('tapeFill');
const curTimeEl = document.getElementById('curTime');
const durTimeEl = document.getElementById('durTime');
const volumeEl = document.getElementById('volume');
const toastEl = document.getElementById('toast');

const ICON_PLAY = '<path d="M8 5v14l11-7z"/>';
const ICON_PAUSE = '<path d="M6 5h4v14H6zm8 0h4v14h-4z"/>';

function fmtTime(s){
  if(!isFinite(s) || s<0) s = 0;
  const m = Math.floor(s/60);
  const sec = Math.floor(s%60);
  return String(m).padStart(2,'0') + ':' + String(sec).padStart(2,'0');
}

function showToast(msg){
  toastEl.textContent = msg;
  toastEl.classList.add('show');
  clearTimeout(showToast._t);
  showToast._t = setTimeout(()=>toastEl.classList.remove('show'), 2200);
}

function renderList(){
  trackListEl.innerHTML = '';
  emptyStateEl.style.display = tracks.length ? 'none' : 'block';
  countPillEl.textContent = tracks.length + ' เพลง';

  tracks.forEach((t, i)=>{
    const li = document.createElement('li');
    li.className = 'track-item' + (i===currentIndex ? ' active' : '');
    li.innerHTML = `
      <span class="track-num">${String(i+1).padStart(2,'0')}</span>
      <div class="track-info">
        <div class="track-name">${escapeHtml(t.name)}</div>
        <div class="track-dur">${t.duration ? fmtTime(t.duration) : ''}</div>
      </div>
      <button class="del-btn" data-id="${t.id}" aria-label="ลบเพลง">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 7h12l-1 13H7L6 7zm3-3h6l1 2H8l1-2z"/></svg>
      </button>
    `;
    li.addEventListener('click', (e)=>{
      if(e.target.closest('.del-btn')) return;
      loadTrack(i, true);
    });
    li.querySelector('.del-btn').addEventListener('click', async (e)=>{
      e.stopPropagation();
      const id = Number(e.currentTarget.dataset.id);
      await deleteTrack(id);
      const removedIdx = tracks.findIndex(x=>x.id===id);
      tracks = tracks.filter(x=>x.id!==id);
      if(removedIdx === currentIndex){
        audio.pause();
        currentIndex = -1;
        trackTitleEl.textContent = tracks.length ? 'เลือกเพลงจากเพลย์ลิสต์' : 'ยังไม่มีเพลง';
        trackSubEl.textContent = '';
        setPlayingUI(false);
      } else if(removedIdx < currentIndex){
        currentIndex--;
      }
      renderList();
      showToast('ลบเพลงแล้ว');
    });
    trackListEl.appendChild(li);
  });
}

function escapeHtml(str){
  const d = document.createElement('div');
  d.textContent = str;
  return d.innerHTML;
}

function loadTrack(index, autoplay){
  if(index < 0 || index >= tracks.length) return;
  currentIndex = index;
  const t = tracks[index];
  if(objectUrl) URL.revokeObjectURL(objectUrl);
  objectUrl = URL.createObjectURL(t.blob);
  audio.src = objectUrl;
  trackTitleEl.textContent = t.name;
  trackSubEl.textContent = 'แทร็ก ' + String(index+1).padStart(2,'0') + ' / ' + String(tracks.length).padStart(2,'0');
  renderList();
  if(autoplay){
    audio.play().catch(()=>{});
  }
}

function setPlayingUI(isPlaying){
  playIcon.innerHTML = isPlaying ? ICON_PAUSE : ICON_PLAY;
  appEl.classList.toggle('playing', isPlaying);
}

playBtn.addEventListener('click', ()=>{
  if(currentIndex === -1){
    if(tracks.length) loadTrack(0, true);
    return;
  }
  if(audio.paused){ audio.play().catch(()=>{}); }
  else { audio.pause(); }
});

document.getElementById('prevBtn').addEventListener('click', ()=>{
  if(!tracks.length) return;
  const i = currentIndex <= 0 ? tracks.length-1 : currentIndex-1;
  loadTrack(i, true);
});
document.getElementById('nextBtn').addEventListener('click', ()=>{
  if(!tracks.length) return;
  const i = currentIndex >= tracks.length-1 ? 0 : currentIndex+1;
  loadTrack(i, true);
});

audio.addEventListener('play', ()=>setPlayingUI(true));
audio.addEventListener('pause', ()=>setPlayingUI(false));
audio.addEventListener('ended', ()=>{
  if(currentIndex < tracks.length-1) loadTrack(currentIndex+1, true);
  else setPlayingUI(false);
});
audio.addEventListener('timeupdate', ()=>{
  if(!isFinite(audio.duration)) return;
  const pct = (audio.currentTime/audio.duration)*100;
  seekEl.value = pct;
  tapeFillEl.style.width = pct + '%';
  curTimeEl.textContent = fmtTime(audio.currentTime);
  durTimeEl.textContent = fmtTime(audio.duration);
});
audio.addEventListener('loadedmetadata', ()=>{
  durTimeEl.textContent = fmtTime(audio.duration);
  if(currentIndex > -1 && tracks[currentIndex]){
    tracks[currentIndex].duration = audio.duration;
  }
});
seekEl.addEventListener('input', ()=>{
  if(!isFinite(audio.duration)) return;
  audio.currentTime = (seekEl.value/100) * audio.duration;
});
volumeEl.addEventListener('input', ()=>{ audio.volume = volumeEl.value; });

// ---------- Add tracks ----------
const addBtn = document.getElementById('addBtn');
const fileInput = document.getElementById('fileInput');
addBtn.addEventListener('click', ()=>fileInput.click());
fileInput.addEventListener('change', async (e)=>{
  const files = Array.from(e.target.files);
  if(!files.length) return;
  for(const file of files){
    const track = { name: file.name.replace(/\.[^/.]+$/, ''), blob: file, addedAt: Date.now(), duration:null };
    const id = await addTrack(track);
    track.id = id;
    tracks.push(track);
  }
  renderList();
  showToast(files.length > 1 ? `เพิ่ม ${files.length} เพลงแล้ว` : 'เพิ่มเพลงแล้ว');
  fileInput.value = '';
});

// ---------- Init ----------
(async function init(){
  db = await openDB();
  tracks = await getAllTracks();
  renderList();
  if(tracks.length){
    trackTitleEl.textContent = 'เลือกเพลงจากเพลย์ลิสต์';
    trackSubEl.textContent = tracks.length + ' เพลงพร้อมเล่น';
  }
  volumeEl.value = 1;

  if('serviceWorker' in navigator){
    navigator.serviceWorker.register('sw.js').catch(()=>{});
  }
})();
</script>
</body>
</html>
