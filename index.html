<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14131F">
<title>Noattepza Archive — เพลงของฉัน</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Itim&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0A0A0B;
    --bg-2:#101011;
    --surface:#161617;
    --surface-2:#1E1E20;
    --surface-3:#27272A;
    --line:#38383C;
    --line-soft:#28282B;
    --amber:#E8A33D;
    --amber-deep:#C97D22;
    --teal:#ff0000;
    --cream:#F2EFE9;
    --dim:#96969C;
    --dim-2:#5A5A60;
    --danger:#E8704F;
    --display:'Itim','Inter',Georgia,serif;
    --body:'Itim','Inter',-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    --mono:'JetBrains Mono','SF Mono',SFMono-Regular,Menlo,Consolas,monospace;
    --sidebar-w:216px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(ellipse 900px 500px at 20% -5%, #1C1C1E 0%, transparent 60%),
      radial-gradient(ellipse 700px 500px at 100% 0%, #17171A 0%, transparent 55%),
      var(--bg);
    color:var(--cream);
    font-family:var(--body);
    min-height:100vh;
  }
  ::selection{background:var(--amber);color:#14131F;}
  button{font-family:inherit;}
  a{color:inherit;}
  ::-webkit-scrollbar{width:10px;height:10px;}
  ::-webkit-scrollbar-track{background:transparent;}
  ::-webkit-scrollbar-thumb{background:var(--surface-3);border-radius:99px;border:2px solid transparent;background-clip:padding-box;}
  ::-webkit-scrollbar-thumb:hover{background:var(--line);}
  body::after{
    content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
    background:radial-gradient(ellipse 700px 400px at 50% 105%, rgba(0,0,0,.35), transparent 60%);
  }

  /* ---------- Layout ---------- */
  .shell{display:flex;min-height:100vh;}
  .sidebar{
    width:var(--sidebar-w);
    flex:none;
    position:fixed;top:0;left:0;bottom:0;
    background:linear-gradient(180deg,var(--bg-2) 0%, #15132199 100%);
    border-right:1px solid var(--line-soft);
    padding:26px 14px 18px;
    display:flex;flex-direction:column;
    z-index:40;
  }
  .brand{
    display:flex;align-items:center;gap:10px;
    padding:0 8px 24px;
  }
  .brand-mark{
    width:34px;height:34px;border-radius:10px;flex:none;
    background:linear-gradient(155deg,var(--amber),var(--amber-deep));
    display:flex;align-items:center;justify-content:center;
    box-shadow:0 6px 16px -6px rgba(232,163,61,.55);
  }
  .brand-mark svg{width:18px;height:18px;color:#14131F;}
  .brand-text{font-family:var(--display);font-weight:700;font-size:17px;letter-spacing:-.01em;}
  .brand-text .sub{display:block;font-family:var(--mono);font-size:9.5px;letter-spacing:.16em;color:var(--dim);text-transform:uppercase;font-weight:400;margin-top:2px;}

  .nav-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px;}
  .nav-item{
    display:flex;align-items:center;gap:12px;
    padding:11px 12px;border-radius:11px;
    color:var(--dim);cursor:pointer;font-size:14px;font-weight:500;
    border:1px solid transparent;
    transition:background .15s,color .15s,border-color .15s;
    -webkit-tap-highlight-color:transparent;
  }
  .nav-item svg{width:18px;height:18px;flex:none;}
  .nav-item:hover{background:var(--surface);color:var(--cream);}
  .nav-item.active{background:var(--surface-2);color:var(--amber);border-color:var(--line);}
  .nav-item.active svg{color:var(--amber);}
  .nav-spacer{flex:1;}
  .sidebar-foot{
    font-family:var(--mono);font-size:10px;color:var(--dim-2);
    padding:10px 10px 2px;letter-spacing:.04em;line-height:1.6;
  }

  .main{
    margin-left:var(--sidebar-w);
    flex:1;min-width:0;
    padding:34px 36px 120px;
    max-width:1080px;
  }

  .view-head{margin-bottom:26px;}
  .eyebrow{
    font-family:var(--mono);font-size:11px;letter-spacing:.18em;
    color:var(--dim);text-transform:uppercase;margin:0 0 6px;
  }
  h1.page-title{
    font-family:var(--display);font-size:32px;font-weight:700;
    letter-spacing:-.01em;margin:0;
  }
  .page-title .accent{color:var(--amber);}
  .page-sub{color:var(--dim);font-size:14px;margin:8px 0 0;max-width:520px;line-height:1.6;}

  /* ---------- Buttons ---------- */
  .btn{
    font-size:13.5px;font-weight:600;border-radius:10px;
    padding:10px 16px;cursor:pointer;border:1px solid var(--line);
    background:var(--surface);color:var(--cream);
    display:inline-flex;align-items:center;gap:8px;
    transition:transform .12s ease, border-color .15s, background .15s;
  }
  .btn svg{width:15px;height:15px;}
  .btn:hover{border-color:var(--amber);}
  .btn:active{transform:scale(.97);}
  .btn-primary{
    background:linear-gradient(155deg,var(--amber),var(--amber-deep));
    color:#14131F;border:none;
  }
  .btn-primary:hover{filter:brightness(1.06);}
  .btn-primary:disabled{opacity:.5;cursor:not-allowed;filter:none;}
  .btn-ghost{background:transparent;border:1px dashed var(--line);color:var(--dim);}
  .btn-ghost:hover{color:var(--amber);border-color:var(--amber);border-style:dashed;}
  .btn-sm{padding:7px 12px;font-size:12.5px;border-radius:8px;}

  /* ---------- Home: Playlist grid (tape-case cards) ---------- */
  .playlist-grid{
    display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));
    gap:16px;
  }
  .case-card{
    background:linear-gradient(165deg,var(--surface) 0%, var(--bg-2) 100%);
    border:1px solid var(--line-soft);
    border-radius:16px;padding:16px;cursor:pointer;
    display:flex;flex-direction:column;gap:14px;
    position:relative;overflow:hidden;
    box-shadow:0 14px 28px -20px rgba(0,0,0,.6);
    transition:border-color .15s, transform .15s, box-shadow .2s;
  }
  .case-card:hover{border-color:var(--amber);transform:translateY(-3px);
    box-shadow:0 18px 34px -18px rgba(232,163,61,.28);}
  .case-card .spine{
    height:64px;border-radius:10px;
    background:radial-gradient(ellipse at 50% 0%, #1E1E20, var(--bg) 75%);
    border:1px solid var(--line);
    box-shadow:inset 0 2px 6px rgba(0,0,0,.5);
    display:flex;align-items:center;justify-content:space-evenly;
  }
  .mini-reel{
    width:26px;height:26px;border-radius:50%;
    border:3px solid var(--r,var(--amber));
    background:radial-gradient(circle at 32% 28%, #242426, var(--bg) 75%);
    box-shadow:inset 0 0 0 1px rgba(0,0,0,.4);
    display:flex;align-items:center;justify-content:center;
  }
  .mini-reel::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--r,var(--amber));}
  .case-card .spine .mini-reel:nth-child(2){--r:var(--teal);}
  .case-name{font-family:var(--display);font-weight:600;font-size:16px;line-height:1.3;}
  .case-meta{font-family:var(--mono);font-size:11px;color:var(--dim);letter-spacing:.03em;}
  .case-card{position:relative;}
  .case-actions{
    position:absolute;top:10px;right:10px;display:flex;gap:6px;
    opacity:0;transition:opacity .12s;z-index:2;
  }
  .case-card:hover .case-actions{opacity:1;}
  .case-actions button{
    background:var(--bg-2);border:1px solid var(--line);
    color:var(--dim);padding:6px;border-radius:8px;cursor:pointer;display:flex;
    transition:color .12s,border-color .12s;
  }
  .case-actions button:hover{color:var(--amber);border-color:var(--amber);}
  .case-actions button.danger:hover{color:var(--danger);border-color:var(--danger);}
  .case-actions svg{width:13px;height:13px;display:block;}

  .create-tile{
    border:1.5px dashed var(--line);border-radius:16px;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;
    color:var(--dim);cursor:pointer;padding:16px;min-height:132px;
    transition:border-color .15s,color .15s;
  }
  .create-tile:hover{border-color:var(--amber);color:var(--amber);}
  .create-tile svg{width:22px;height:22px;}
  .create-tile span{font-size:13px;font-weight:600;}

  .empty-panel{
    border:1px solid var(--line-soft);border-radius:16px;
    padding:40px 24px;text-align:center;color:var(--dim);
  }
  .empty-panel svg{width:34px;height:34px;color:var(--dim-2);margin-bottom:10px;}
  .empty-panel p{margin:4px 0 16px;font-size:13.5px;line-height:1.6;}

  /* ---------- All songs / list rows ---------- */
  .song-row{
    display:flex;align-items:center;gap:12px;
    background:var(--surface);border:1px solid var(--line-soft);
    border-radius:12px;padding:10px 12px;margin-bottom:8px;cursor:pointer;
  }
  .song-row:hover{border-color:var(--line);}
  .song-row.playing{border-color:var(--amber);background:var(--surface-2);}
  .song-num{font-family:var(--mono);font-size:12px;color:var(--dim);width:22px;text-align:center;flex:none;}
  .song-row.playing .song-num{color:var(--amber);}
  .song-play-ico{width:16px;height:16px;color:var(--dim);flex:none;}
  .song-info{flex:1;min-width:0;}
  .song-name{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .song-artist{font-size:12px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px;}
  .song-dur{font-family:var(--mono);font-size:11px;color:var(--dim-2);margin-top:2px;}
  .row-actions{display:flex;gap:4px;flex:none;}
  .icon-btn{
    background:none;border:none;color:var(--dim);cursor:pointer;
    padding:7px;border-radius:8px;display:flex;
  }
  .icon-btn:hover{color:var(--amber);background:var(--surface-3);}
  .icon-btn.danger:hover{color:var(--danger);}
  .icon-btn svg{width:16px;height:16px;}

  /* ---------- Upload page ---------- */
  .dropzone{
    border:1.5px dashed var(--line);border-radius:18px;
    padding:46px 24px;text-align:center;cursor:pointer;
    transition:border-color .15s,background .15s;
    background:var(--surface);
  }
  .dropzone.drag{border-color:var(--amber);background:var(--surface-2);}
  .dropzone svg{width:32px;height:32px;color:var(--amber);margin-bottom:12px;}
  .dropzone h3{font-family:var(--display);font-size:18px;margin:0 0 6px;}
  .dropzone p{color:var(--dim);font-size:13px;margin:0;}
  .dropzone .fmt{font-family:var(--mono);font-size:11px;color:var(--dim-2);margin-top:10px;}
  input[type=file]{display:none;}

  .upload-note{
    margin-top:16px;padding:13px 15px;border-radius:12px;
    background:var(--surface);border:1px solid var(--line-soft);
    font-size:12.5px;color:var(--dim);line-height:1.6;
    display:flex;gap:10px;
  }
  .upload-note svg{width:16px;height:16px;flex:none;color:var(--teal);margin-top:1px;}

  .section-divider{
    display:flex;align-items:center;gap:12px;margin:28px 0 18px;
    color:var(--dim);font-family:var(--mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;
  }
  .section-divider::before,.section-divider::after{content:"";flex:1;height:1px;background:var(--line-soft);}

  .tiktok-box{
    background:var(--surface);border:1px solid var(--line-soft);border-radius:18px;padding:22px;
  }
  .tiktok-head{display:flex;align-items:center;gap:10px;margin-bottom:14px;}
  .tiktok-head .tk-icon{
    width:34px;height:34px;border-radius:10px;flex:none;
    background:linear-gradient(155deg,#D9502E22,#E8A33D22);
    border:1px solid var(--line);
    display:flex;align-items:center;justify-content:center;
  }
  .tiktok-head .tk-icon svg{width:17px;height:17px;color:var(--teal);}
  .tiktok-head h3{font-family:var(--display);font-size:16px;margin:0;}
  .tiktok-head p{margin:2px 0 0;font-size:12px;color:var(--dim);}
  .tiktok-input-row{display:flex;gap:8px;margin-bottom:6px;}
  .tiktok-input-row input[type=text]{
    flex:1;background:var(--bg);border:1px solid var(--line);border-radius:10px;
    padding:12px 14px;color:var(--cream);font-size:14px;font-family:var(--body);
  }
  .tiktok-input-row input[type=text]:focus{outline:none;border-color:var(--teal);}
  .tiktok-status{font-size:12.5px;color:var(--dim);min-height:18px;margin-top:6px;}
  .tiktok-status.error{color:var(--danger);}
  .tiktok-preview{
    display:none;margin-top:16px;padding:14px;border-radius:14px;
    background:var(--bg-2);border:1px solid var(--line-soft);
    display:flex;gap:12px;align-items:flex-start;
  }
  .tiktok-preview img{width:56px;height:56px;border-radius:10px;object-fit:cover;flex:none;background:var(--surface-3);}
  .tiktok-preview .tp-info{flex:1;min-width:0;}
  .tiktok-preview .tp-title{font-size:13.5px;font-weight:600;line-height:1.4;margin-bottom:2px;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
  .tiktok-preview .tp-author{font-family:var(--mono);font-size:11px;color:var(--dim);}
  .tiktok-preview .tp-actions{margin-top:10px;display:flex;gap:8px;}

  .queue-list{margin-top:22px;}
  .queue-list h2{font-family:var(--mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--dim);margin:0 0 10px;}

  /* ---------- Playlist detail: cassette player ---------- */
  .detail-back{
    display:inline-flex;align-items:center;gap:6px;color:var(--dim);
    font-size:12.5px;cursor:pointer;margin-bottom:14px;font-family:var(--mono);
  }
  .detail-back:hover{color:var(--amber);}
  .detail-back svg{width:14px;height:14px;}

  .cassette{
    position:relative;
    background-image:
      radial-gradient(circle at 40% 40%, #6E6E74 0%, #1A1A1C 68%, transparent 72%),
      radial-gradient(circle at 40% 40%, #6E6E74 0%, #1A1A1C 68%, transparent 72%),
      radial-gradient(circle at 40% 40%, #6E6E74 0%, #1A1A1C 68%, transparent 72%),
      radial-gradient(circle at 40% 40%, #6E6E74 0%, #1A1A1C 68%, transparent 72%),
      linear-gradient(165deg,var(--surface) 0%, var(--bg-2) 58%, #171429 100%);
    background-repeat:no-repeat;
    background-size:8px 8px,8px 8px,8px 8px,8px 8px,100% 100%;
    background-position:18px 18px, calc(100% - 18px) 18px, 18px calc(100% - 18px), calc(100% - 18px) calc(100% - 18px), 0 0;
    border:1px solid var(--line);border-radius:24px;
    padding:28px 26px 24px;max-width:440px;
    box-shadow:
      0 32px 60px -28px rgba(0,0,0,.75),
      0 1px 0 rgba(255,255,255,.05) inset,
      0 0 0 1px rgba(0,0,0,.4);
  }
  .cassette::before{
    content:"";position:absolute;inset:1px;border-radius:23px;pointer-events:none;
    background:radial-gradient(ellipse 320px 130px at 50% -8%, rgba(232,163,61,.11), transparent 70%);
  }
  .reels{position:relative;display:flex;align-items:center;justify-content:space-between;padding:6px 24px 18px;}
  .waveform-bars{
    flex:1;height:22px;margin:0 14px;position:relative;z-index:0;
    display:flex;align-items:center;justify-content:space-between;gap:3px;
    pointer-events:none;
  }
  .wf-bar{
    flex:1;max-width:6px;min-width:2px;border-radius:2px;
    background:linear-gradient(180deg,var(--amber),var(--amber-deep));
    transition:height .12s ease-out;opacity:.92;
  }
  .cassette.playing .wf-bar{transition:height .07s linear;}
  .reel{
    width:70px;height:70px;border-radius:50%;
    border:5px solid var(--reel-color,var(--amber));
    background:radial-gradient(circle at 32% 28%, #242426 0%, var(--bg) 72%);
    display:flex;align-items:center;justify-content:center;
    position:relative;z-index:1;
    box-shadow:
      inset 0 0 0 1px rgba(0,0,0,.4),
      inset 0 7px 10px -7px rgba(255,255,255,.10),
      0 8px 16px -9px rgba(0,0,0,.7);
    animation:spin 2.4s linear infinite paused;
    transition:box-shadow .35s ease;
  }
  .reel::before{content:"";width:16px;height:16px;border-radius:50%;background:var(--reel-color,var(--amber));
    box-shadow:0 1px 2px rgba(0,0,0,.4);}
  .reel::after{content:"";position:absolute;inset:12px;border-radius:50%;border:2px dashed var(--line);}
  .reel.left{--reel-color:var(--amber);}
  .reel.right{--reel-color:var(--teal);}
  .cassette.playing .reel{animation-play-state:running;}
  .cassette.playing .reel.left{box-shadow:inset 0 0 0 1px rgba(0,0,0,.4), inset 0 7px 10px -7px rgba(255,255,255,.1), 0 0 20px -2px rgba(232,163,61,.6);}
  .cassette.playing .reel.right{box-shadow:inset 0 0 0 1px rgba(0,0,0,.4), inset 0 7px 10px -7px rgba(255,255,255,.1), 0 0 20px -2px rgba(79,209,197,.6);}
  @keyframes spin{to{transform:rotate(360deg);}}

  .label{
    position:relative;
    background:
      repeating-linear-gradient(180deg, rgba(255,255,255,.014) 0 1px, transparent 1px 3px),
      linear-gradient(180deg, #0F0F10, #08080A);
    border-radius:14px;padding:16px 18px;
    text-align:center;min-height:60px;
    display:flex;flex-direction:column;justify-content:center;gap:4px;
    border:1px solid var(--line-soft);
    box-shadow:inset 0 2px 8px rgba(0,0,0,.55), inset 0 -1px 0 rgba(255,255,255,.03);
  }
  .track-title{font-family:var(--display);font-weight:600;font-size:17px;line-height:1.3;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
    text-shadow:0 0 22px rgba(232,163,61,.12);}
  .track-sub{font-size:11.5px;color:var(--dim);font-family:var(--mono);letter-spacing:.04em;}

  .seek-wrap{position:relative;margin-top:18px;}
  .tape-track{height:6px;background:var(--line);border-radius:99px;position:relative;
    box-shadow:inset 0 1px 3px rgba(0,0,0,.5);}
  .tape-fill{position:absolute;left:0;top:0;bottom:0;border-radius:99px;
    background:linear-gradient(90deg,var(--amber),var(--teal));width:0%;
    box-shadow:0 0 10px rgba(232,163,61,.45);}
  input[type=range]{
    -webkit-appearance:none;appearance:none;width:100%;height:6px;
    background:transparent;margin:0;position:relative;z-index:2;
  }
  input[type=range]::-webkit-slider-thumb{
    -webkit-appearance:none;width:16px;height:16px;border-radius:50%;
    background:radial-gradient(circle at 35% 30%, #fff, var(--cream) 65%);
    margin-top:-5px;border:2px solid var(--bg);
    box-shadow:0 0 0 4px rgba(232,163,61,.16), 0 3px 8px rgba(0,0,0,.55);
  }
  input[type=range]::-webkit-slider-runnable-track{height:6px;background:transparent;}
  .seek-wrap .tape-track{position:absolute;left:0;right:0;top:50%;transform:translateY(-50%);z-index:1;}

  .counter-row{
    display:flex;justify-content:space-between;align-items:center;
    margin-top:9px;font-family:var(--mono);font-size:11px;color:var(--dim);
  }

  .controls{display:flex;align-items:center;justify-content:center;gap:14px;margin-top:20px;}
  .btn-round{
    background:linear-gradient(160deg,var(--surface-3),var(--surface-2));
    border:1px solid var(--line);color:var(--cream);
    width:44px;height:44px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;cursor:pointer;
    box-shadow:0 5px 12px -7px rgba(0,0,0,.7), inset 0 1px 0 rgba(255,255,255,.07);
    transition:transform .12s ease,box-shadow .15s ease,border-color .15s ease;flex:none;
  }
  .btn-round:hover{border-color:var(--amber);}
  .btn-round:active{transform:scale(.92);}
  .btn-round.skip{width:38px;height:38px;}
  .btn-round.skip svg{width:16px;height:16px;}
  .btn-play{
    width:60px;height:60px;background:linear-gradient(160deg,var(--amber),var(--amber-deep));
    color:#14131F;border:none;
    box-shadow:0 12px 26px -10px rgba(232,163,61,.7), inset 0 1px 0 rgba(255,255,255,.35);
  }
  .btn-play:hover{border-color:transparent;}
  .cassette.playing .btn-play{animation:pulseGlow 2s ease-in-out infinite;}
  @keyframes pulseGlow{
    0%,100%{box-shadow:0 12px 26px -10px rgba(232,163,61,.7), inset 0 1px 0 rgba(255,255,255,.35);}
    50%{box-shadow:0 12px 32px -6px rgba(232,163,61,.95), inset 0 1px 0 rgba(255,255,255,.35);}
  }
  .btn-round svg{width:17px;height:17px;}
  .btn-play svg{width:22px;height:22px;}
  .skip-label{
    position:absolute;font-family:var(--mono);font-size:8px;font-weight:600;
    bottom:-3px;
  }

  .vol-row{display:flex;align-items:center;gap:10px;margin-top:20px;}
  .vol-row svg{width:15px;height:15px;color:var(--dim);flex:none;}

<script>
/* ======================= IndexedDB ======================= */
const DB_NAME = 'archiveDB';
let db;

function openDB(){
  return new Promise((resolve,reject)=>{
    const req = indexedDB.open(DB_NAME, 1);
    req.onupgradeneeded = (e)=>{
      const _db = e.target.result;
      if(!_db.objectStoreNames.contains('tracks')){
        _db.createObjectStore('tracks',{keyPath:'id',autoIncrement:true}).createIndex('addedAt','addedAt');
      }
      if(!_db.objectStoreNames.contains('playlists')){
        _db.createObjectStore('playlists',{keyPath:'id',autoIncrement:true}).createIndex('createdAt','createdAt');
      }
    };
    req.onsuccess = e=>resolve(e.target.result);
    req.onerror = e=>reject(e.target.error);
  });
}
function dbAdd(store,obj){
  return new Promise((res,rej)=>{
    const tx = db.transaction(store,'readwrite');
    const r = tx.objectStore(store).add(obj);
    r.onsuccess = ()=>res(r.result);
    r.onerror = e=>rej(e.target.error);
  });
}
function dbPut(store,obj){
  return new Promise((res,rej)=>{
    const tx = db.transaction(store,'readwrite');
    const r = tx.objectStore(store).put(obj);
    r.onsuccess = ()=>res(r.result);
    r.onerror = e=>rej(e.target.error);
  });
}
function dbDelete(store,id){
  return new Promise((res,rej)=>{
    const tx = db.transaction(store,'readwrite');
    const r = tx.objectStore(store).delete(id);
    r.onsuccess = ()=>res();
    r.onerror = e=>rej(e.target.error);
  });
}
function dbGetAll(store,sortKey){
  return new Promise((res,rej)=>{
    const tx = db.transaction(store,'readonly');
    const r = tx.objectStore(store).getAll();
    r.onsuccess = ()=>{
      const arr = r.result;
      if(sortKey) arr.sort((a,b)=>a[sortKey]-b[sortKey]);
      res(arr);
    };
    r.onerror = e=>rej(e.target.error);
  });
}

/* ======================= TikTok fetch (personal use) ======================= */
// เว็ป API สาธารณะแบบเดียวกับที่ใช้ในเว็ปดาวน์โหลด TikTok ของคุณ
const TIKTOK_API_ENDPOINT = "https://www.tikwm.com/api/";
let tiktokFetchedData = null; // ผลลัพธ์ล่าสุดที่ดึงมา รอกดยืนยันเพิ่มเข้าคลัง

async function tiktokFetchInfo(url){
  const apiUrl = `${TIKTOK_API_ENDPOINT}?url=${encodeURIComponent(url)}&hd=1`;
  const res = await fetch(apiUrl);
  if(!res.ok) throw new Error('เรียก API ไม่สำเร็จ (' + res.status + ')');
  const json = await res.json();
  if(json.code !== 0 || !json.data) throw new Error(json.msg || 'ไม่พบวิดีโอจากลิงก์นี้');
  return json.data;
}

async function urlToBlob(url){
  const res = await fetch(url);
  if(!res.ok) throw new Error('ดาวน์โหลดไฟล์ไม่สำเร็จ (' + res.status + ')');
  return await res.blob();
}

/* ======================= State ======================= */
let tracks = [];      // {id,name,blob,duration,addedAt}
let playlists = [];   // {id,name,trackIds:[],createdAt}
let route = {name:'home', params:{}};
let objectUrl = null;
let queue = [];        // ordered array of track objects currently playable
let queueContext = null; // {type:'playlist'|'all', id}
let currentIndex = -1;
let shuffleOn = false;
let repeatMode = 'off'; // 'off' | 'all' | 'one'
let songSearchQuery = '';
let visibleSongs = [];  // last filtered list shown on the "all songs" page
let dragSrcIndex = null;

const audio = new Audio();
audio.preload = 'metadata';

/* ======================= Waveform (Web Audio analyser) ======================= */
const WAVEFORM_BASELINE = [6,10,14,8,18,12,20,9,15,7,11,17,13,19,8,14,10,16,12,7,18,9,15,11];
function renderWaveformBarsHTML(){
  return WAVEFORM_BASELINE.map(h=>`<span class="wf-bar" style="height:${h}px"></span>`).join('');
}
let audioCtx=null, analyser=null, sourceNode=null, waveformData=null, waveformRaf=null;
function primeAudioGraph(){
  if(audioCtx){
    if(audioCtx.state==='suspended') audioCtx.resume().catch(()=>{});
    return;
  }
  try{
    const Ctx = window.AudioContext || window.webkitAudioContext;
    if(!Ctx) return;
    audioCtx = new Ctx();
    sourceNode = audioCtx.createMediaElementSource(audio);
    analyser = audioCtx.createAnalyser();
    analyser.fftSize = 64;
    analyser.smoothingTimeConstant = 0.75;
    sourceNode.connect(analyser);
    analyser.connect(audioCtx.destination);
    waveformData = new Uint8Array(analyser.frequencyBinCount);
  }catch(err){
    console.warn('Waveform analyser unavailable:', err);
    audioCtx = null; analyser = null;
  }
}
function startWaveformLoop(){
  cancelAnimationFrame(waveformRaf);
  if(!analyser) return;
  const tick = ()=>{
    const bars = document.querySelectorAll('#waveformBars .wf-bar');
    if(bars.length){
      analyser.getByteFrequencyData(waveformData);
      const n = bars.length;
      for(let i=0;i<n;i++){
        const bin = Math.floor((i/n) * (waveformData.length*0.7)); // favor bass/mid bins with more musical energy
        const v = waveformData[bin] || 0;
        bars[i].style.height = (Math.max(4, Math.round((v/255)*20)+4))+'px';
      }
    }
    waveformRaf = requestAnimationFrame(tick);
  };
  waveformRaf = requestAnimationFrame(tick);
}
function stopWaveformLoop(){
  cancelAnimationFrame(waveformRaf);
  waveformRaf = null;
  document.querySelectorAll('#waveformBars .wf-bar').forEach((bar,i)=>{
    bar.style.height = WAVEFORM_BASELINE[i % WAVEFORM_BASELINE.length]+'px';
  });
}
audio.addEventListener('play', startWaveformLoop);
audio.addEventListener('pause', stopWaveformLoop);
audio.addEventListener('ended', stopWaveformLoop);

/* ======================= Helpers ======================= */
function fmtTime(s){
  if(!isFinite(s)||s<0) s=0;
  const m = Math.floor(s/60), sec = Math.floor(s%60);
  return String(m).padStart(2,'0')+':'+String(sec).padStart(2,'0');
}
function escapeHtml(str){
  const d = document.createElement('div');
  d.textContent = str;
  return d.innerHTML;
}
let toastTimer;
function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>t.classList.remove('show'),2200);
}
function navigate(name, params={}){
  route = {name, params};
  render();
}

/* ======================= Playback engine ======================= */
function playQueue(list, startIndex, context){
  queue = list;
  queueContext = context;
  loadIndex(startIndex, true);
}
function loadIndex(i, autoplay){
  if(i<0 || i>=queue.length) return;
  currentIndex = i;
  const t = queue[i];
  if(objectUrl) URL.revokeObjectURL(objectUrl);
  objectUrl = URL.createObjectURL(t.blob);
  audio.src = objectUrl;
  if(autoplay){ primeAudioGraph(); audio.play().catch(()=>{}); }
  updateNowPlayingUI();
  renderTrackListsHighlight();
}
function togglePlay(){
  if(currentIndex===-1){
    if(queue.length) loadIndex(0,true);
    return;
  }
  if(audio.paused){ primeAudioGraph(); audio.play().catch(()=>{}); }
  else audio.pause();
}
function nextIndexFor(delta){
  if(!queue.length) return -1;
  if(shuffleOn && queue.length>1){
    let i;
    do{ i = Math.floor(Math.random()*queue.length); }while(i===currentIndex);
    return i;
  }
  let i = currentIndex + delta;
  if(i<0) i = queue.length-1;
  if(i>=queue.length) i = 0;
  return i;
}
function skip(delta){
  if(!queue.length) return;
  loadIndex(nextIndexFor(delta), true);
}
function toggleShuffle(){
  shuffleOn = !shuffleOn;
  refreshTransportToggles();
  showToast(shuffleOn ? 'เปิดสุ่มเพลง' : 'ปิดสุ่มเพลง');
}
function cycleRepeat(){
  repeatMode = repeatMode==='off' ? 'all' : repeatMode==='all' ? 'one' : 'off';
  refreshTransportToggles();
  const labels = {off:'ปิดวนซ้ำ', all:'วนซ้ำทั้งเพลย์ลิสต์', one:'วนซ้ำเพลงเดียว'};
  showToast(labels[repeatMode]);
}
function refreshTransportToggles(){
  const sBtn = document.getElementById('shuffleBtn');
  const rBtn = document.getElementById('repeatBtn');
  if(sBtn) sBtn.classList.toggle('active', shuffleOn);
  if(rBtn){
    rBtn.classList.toggle('active', repeatMode!=='off');
    let dot = rBtn.querySelector('.rpt-dot');
    if(repeatMode==='one'){
      if(!dot){ dot = document.createElement('span'); dot.className='rpt-dot'; rBtn.appendChild(dot); }
    }else if(dot){ dot.remove(); }
  }
}
function seekBy(sec){
  if(currentIndex===-1 || !isFinite(audio.duration)) return;
  audio.currentTime = Math.min(Math.max(0,audio.currentTime+sec), audio.duration);
}

audio.addEventListener('play', ()=>setPlayingUI(true));
audio.addEventListener('pause', ()=>setPlayingUI(false));
audio.addEventListener('ended', ()=>{
  if(repeatMode==='one'){
    audio.currentTime = 0;
    audio.play().catch(()=>{});
    return;
  }
  if(shuffleOn && queue.length>1){
    loadIndex(nextIndexFor(1), true);
    return;
  }
  if(currentIndex < queue.length-1) loadIndex(currentIndex+1, true);
  else if(repeatMode==='all' && queue.length) loadIndex(0, true);
  else setPlayingUI(false);
});
audio.addEventListener('loadedmetadata', ()=>{
  if(currentIndex>-1 && queue[currentIndex]){
    queue[currentIndex].duration = audio.duration;
    const t = tracks.find(x=>x.id===queue[currentIndex].id);
    if(t){ t.duration = audio.duration; dbPut('tracks', t); }
  }
  updateTimeUI();
});
audio.addEventListener('timeupdate', updateTimeUI);

function updateTimeUI(){
  const durEl = document.getElementById('curTime');
  const totEl = document.getElementById('durTime');
  const fillEl = document.getElementById('tapeFill');
  const seekEl = document.getElementById('seek');
  const pct = isFinite(audio.duration) && audio.duration>0 ? (audio.currentTime/audio.duration)*100 : 0;
  if(durEl) durEl.textContent = fmtTime(audio.currentTime);
  if(totEl) totEl.textContent = fmtTime(audio.duration);
  if(fillEl) fillEl.style.width = pct+'%';
  if(seekEl && document.activeElement !== seekEl) seekEl.value = pct;
}

function setPlayingUI(isPlaying){
  const cassette = document.querySelector('.cassette');
  if(cassette) cassette.classList.toggle('playing', isPlaying);
  const playIcon = document.getElementById('playIcon');
  if(playIcon) playIcon.innerHTML = isPlaying ? ICON_PAUSE : ICON_PLAY;
  const miniPlayIcon = document.getElementById('miniPlayIcon');
  if(miniPlayIcon) miniPlayIcon.innerHTML = isPlaying ? ICON_PAUSE : ICON_PLAY;
  refreshMiniPlayer();
}
const ICON_PLAY = '<path d="M8 5v14l11-7z"/>';
const ICON_PAUSE = '<path d="M6 5h4v14H6zm8 0h4v14h-4z"/>';
const ICON_SHUFFLE = '<path d="M16 3h5v5M4 20L20.5 3.5M21 16v5h-5M15 15l5.5 5.5M4 4l5 5"/>';
const ICON_REPEAT = '<path d="M17 2l4 4-4 4M3 11V9a4 4 0 014-4h14M7 22l-4-4 4-4M21 13v2a4 4 0 01-4 4H3"/>';
const ICON_EDIT = '<path d="M12 20h9M16.5 3.5a2.12 2.12 0 013 3L7 19l-4 1 1-4 12.5-12.5z"/>';
const ICON_DRAG = '<circle cx="9" cy="6" r="1.2"/><circle cx="15" cy="6" r="1.2"/><circle cx="9" cy="12" r="1.2"/><circle cx="15" cy="12" r="1.2"/><circle cx="9" cy="18" r="1.2"/><circle cx="15" cy="18" r="1.2"/>';
const ICON_SEARCH = '<circle cx="11" cy="11" r="7"/><path d="M21 21l-4.35-4.35"/>';

function updateNowPlayingUI(){
  const t = queue[currentIndex];
  const titleEl = document.getElementById('trackTitle');
  const subEl = document.getElementById('trackSub');
  if(titleEl) titleEl.textContent = t ? t.name : 'ยังไม่มีเพลง';
  if(subEl) subEl.textContent = t ? `แทร็ก ${String(currentIndex+1).padStart(2,'0')} / ${String(queue.length).padStart(2,'0')}` : '';
  refreshMiniPlayer();
}
function refreshMiniPlayer(){
  const mp = document.getElementById('miniPlayer');
  const t = queue[currentIndex];
  const onDetail = route.name==='playlist' || route.name==='songs';
  if(!t || onDetail){ mp.classList.remove('show'); return; }
  mp.classList.add('show');
  document.getElementById('miniTitle').textContent = t.name;
  document.getElementById('miniSub').textContent = queueContext && queueContext.name ? queueContext.name : '';
}
document.getElementById('miniPlay').addEventListener('click', togglePlay);
document.getElementById('miniPrev').addEventListener('click', ()=>skip(-1));
document.getElementById('miniNext').addEventListener('click', ()=>skip(1));
document.getElementById('miniInfo').addEventListener('click', ()=>{
  if(queueContext && queueContext.type==='playlist') navigate('playlist',{id:queueContext.id});
  else if(queueContext && queueContext.type==='all') navigate('songs');
});

function renderTrackListsHighlight(){
  document.querySelectorAll('[data-track-row]').forEach(el=>{
    const id = Number(el.dataset.trackRow);
    const isPlaying = currentIndex>-1 && queue[currentIndex] && queue[currentIndex].id===id;
    el.classList.toggle('playing', isPlaying);
  });
}

/* ======================= Views ======================= */
function setActiveNav(){
  document.querySelectorAll('.nav-item').forEach(el=>{
    el.classList.toggle('active',
      (el.dataset.route==='home' && route.name==='home') ||
      (el.dataset.route==='create' && route.name==='create') ||
      (el.dataset.route==='songs' && (route.name==='songs')) ||
      (el.dataset.route==='upload' && route.name==='upload')
    );
  });
}

function render(){
  setActiveNav();
  const view = document.getElementById('view');
  if(route.name==='home') view.innerHTML = viewHome();
  else if(route.name==='songs') view.innerHTML = viewAllSongs();
  else if(route.name==='upload') view.innerHTML = viewUpload();
  else if(route.name==='create') view.innerHTML = viewCreate();
  else if(route.name==='playlist') view.innerHTML = viewPlaylistDetail(route.params.id);
  bindViewEvents();
  refreshMiniPlayer();
  renderTrackListsHighlight();
}

function getFilteredSongs(){
  const q = songSearchQuery.trim().toLowerCase();
  return q ? tracks.filter(t=>t.name.toLowerCase().includes(q)) : tracks;
}

function openAddToPlaylistModal(trackId){
  const root = document.getElementById('modalRoot');
  const options = playlists.map(p=>`
    <label class="check-row">
      <input type="checkbox" value="${p.id}" ${p.trackIds.includes(trackId) ? 'checked' : ''}>
      <span>${escapeHtml(p.name)}</span>
    </label>
  `).join('') || `<div style="color:var(--dim);font-size:13px;">ยังไม่มีเพลย์ลิสต์ — สร้างใหม่ก่อน</div>`;
  root.innerHTML = `
    <div class="overlay" id="ovAdd">
      <div class="modal">
        <h3>เพิ่มลงเพลย์ลิสต์</h3>
        <div class="modal-tracks">${options}</div>
        <div class="modal-actions">
          <button class="btn" id="cancelAdd">ปิด</button>
          <button class="btn btn-primary" id="confirmAdd">บันทึก</button>
        </div>
      </div>
    </div>
  `;
  document.getElementById('ovAdd').addEventListener('click', e=>{ if(e.target.id==='ovAdd') root.innerHTML=''; });
  document.getElementById('cancelAdd').addEventListener('click', ()=>root.innerHTML='');
  document.getElementById('confirmAdd').addEventListener('click', async ()=>{
    const checked = Array.from(root.querySelectorAll('.check-row input:checked')).map(i=>Number(i.value));
    for(const p of playlists){
      const should = checked.includes(p.id);
      const has = p.trackIds.includes(trackId);
      if(should && !has) p.trackIds.push(trackId);
      if(!should && has) p.trackIds = p.trackIds.filter(id=>id!==trackId);
      await dbPut('playlists', p);
    }
    root.innerHTML = '';
    showToast('อัปเดตเพลย์ลิสต์แล้ว');
    render();
  });
}

        ${type==='track' ? `

/* ======================= Playlist track drag-to-reorder ======================= */
function bindPlaylistTracklistDnD(playlistId){
  const rows = Array.from(document.querySelectorAll('#detailTrackList li[data-track-row]'));
  rows.forEach((li, idx)=>{
    li.addEventListener('dragstart', (e)=>{
      if(!e.target.closest('.drag-handle')){ e.preventDefault(); return; }
      dragSrcIndex = idx;
      li.classList.add('dragging');
      e.dataTransfer.effectAllowed = 'move';
    });
    li.addEventListener('dragend', ()=>{
      li.classList.remove('dragging');
      rows.forEach(r=>r.classList.remove('drag-over'));
    });
    li.addEventListener('dragover', (e)=>{
      e.preventDefault();
      if(dragSrcIndex!==null && dragSrcIndex!==idx) li.classList.add('drag-over');
    });
    li.addEventListener('dragleave', ()=>li.classList.remove('drag-over'));
    li.addEventListener('drop', async (e)=>{
      e.preventDefault();
      li.classList.remove('drag-over');
      if(dragSrcIndex===null || dragSrcIndex===idx) return;
      const pl = playlists.find(p=>p.id===playlistId);
      const moved = pl.trackIds.splice(dragSrcIndex, 1)[0];
      pl.trackIds.splice(idx, 0, moved);
      await dbPut('playlists', pl);
      dragSrcIndex = null;
      render();
      showToast('จัดลำดับเพลงใหม่แล้ว');
    });
  });
}

/* ======================= Backup: export / import ======================= */
function blobToBase64(blob){
  return new Promise((resolve,reject)=>{
    const reader = new FileReader();
    reader.onload = ()=>resolve(reader.result);
    reader.onerror = ()=>reject(reader.error);
    reader.readAsDataURL(blob);
  });
}
async function dataUrlToBlob(dataUrl){
  const res = await fetch(dataUrl);
  return await res.blob();
}
async function exportBackup(){
  const statusEl = document.getElementById('backupStatus');
  if(!tracks.length && !playlists.length){
    showToast('ยังไม่มีข้อมูลให้สำรอง');
    return;
  }
  if(statusEl) statusEl.textContent = 'กำลังเตรียมไฟล์สำรอง...';
  try{
    const trackData = [];
    for(const t of tracks){
      const base64 = await blobToBase64(t.blob);
      trackData.push({id:t.id, name:t.name, artist:t.artist||'', addedAt:t.addedAt, duration:t.duration, mime:(t.blob.type||'audio/mpeg'), data:base64});
    }
    const payload = {
      app:'the-archive-backup', version:1, exportedAt:Date.now(),
      tracks:trackData,
      playlists:playlists.map(p=>({id:p.id, name:p.name, trackIds:p.trackIds, createdAt:p.createdAt}))
    };
    const blob = new Blob([JSON.stringify(payload)], {type:'application/json'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `archive-backup-${new Date().toISOString().slice(0,10)}.json`;
    document.body.appendChild(a);
    a.click();
    a.remove();
    URL.revokeObjectURL(url);
    if(statusEl) statusEl.textContent = `สร้างไฟล์สำรองแล้ว (${tracks.length} เพลง, ${playlists.length} เพลย์ลิสต์)`;
    showToast('ดาวน์โหลดไฟล์สำรองแล้ว');
  }catch(err){
    console.error(err);
    if(statusEl) statusEl.textContent = 'สร้างไฟล์สำรองไม่สำเร็จ: ' + err.message;
    showToast('สร้างไฟล์สำรองไม่สำเร็จ');
  }
}
async function importBackupFile(file){
  const statusEl = document.getElementById('backupStatus');
  if(statusEl) statusEl.textContent = 'กำลังนำเข้าข้อมูล...';
  try{
    const text = await file.text();
    const payload = JSON.parse(text);
    if(!payload || !Array.isArray(payload.tracks)) throw new Error('รูปแบบไฟล์ไม่ถูกต้อง');
    const idMap = {};
    for(const td of payload.tracks){
      const blob = await dataUrlToBlob(td.data);
      const track = {name:td.name || 'ไม่มีชื่อ', artist:td.artist || '', blob, addedAt:td.addedAt || Date.now(), duration:td.duration || null};
      const newId = await dbAdd('tracks', track);
      track.id = newId;
      tracks.push(track);
      idMap[td.id] = newId;
    }
    for(const pd of (payload.playlists || [])){
      const newTrackIds = (pd.trackIds || []).map(oid=>idMap[oid]).filter(x=>x!==undefined);
      const pl = {name:pd.name || 'เพลย์ลิสต์นำเข้า', trackIds:newTrackIds, createdAt:pd.createdAt || Date.now()};
      const newPlId = await dbAdd('playlists', pl);
      pl.id = newPlId;
      playlists.push(pl);
    }
    if(statusEl) statusEl.textContent = `นำเข้าสำเร็จ: ${payload.tracks.length} เพลง, ${(payload.playlists||[]).length} เพลย์ลิสต์`;
    showToast('นำเข้าข้อมูลสำเร็จ');
    render();
  }catch(err){
    console.error(err);
    if(statusEl) statusEl.textContent = 'นำเข้าข้อมูลไม่สำเร็จ: ' + err.message;
    showToast('นำเข้าข้อมูลไม่สำเร็จ');
  }
}

/* ======================= Event binding ======================= */
function bindViewEvents(){
  // route links
  document.querySelectorAll('[data-route-link]').forEach(el=>{
    el.addEventListener('click', ()=>navigate(el.dataset.routeLink));
  });
  document.querySelectorAll('[data-open-playlist]').forEach(el=>{

  });

  // All songs
  bindSongsListEvents();
  const songSearchInput = document.getElementById('songSearch');
  if(songSearchInput){
    songSearchInput.addEventListener('input', (e)=>{
      songSearchQuery = e.target.value;
      document.getElementById('songsListWrap').innerHTML = renderSongsListHTML();
      bindSongsListEvents();
      renderTrackListsHighlight();
    });
  }

  // Rename playlists, works from any view (home cards + playlist detail title)
  document.querySelectorAll('[data-rename-playlist]').forEach(el=>{
    el.addEventListener('click', (e)=>{ e.stopPropagation(); openRenameModal('playlist', Number(el.dataset.renamePlaylist)); });
  });

  // Delete playlists, works from any view (home cards + playlist detail title)
  document.querySelectorAll('[data-delete-playlist]').forEach(el=>{
    el.addEventListener('click', (e)=>{
      e.stopPropagation();
      const id = Number(el.dataset.deletePlaylist);
      const pl = playlists.find(p=>p.id===id);
      if(!pl) return;
      openConfirmModal({
        title:'ลบเพลย์ลิสต์นี้?',
        message:`"${escapeHtml(pl.name)}" จะถูกลบออกไป — เพลงในคลังจะยังอยู่เหมือนเดิม ไม่ถูกลบ`,
        confirmLabel:'ลบเพลย์ลิสต์',
        onConfirm: async ()=>{
          await dbDelete('playlists', id);
          playlists = playlists.filter(p=>p.id!==id);
          if(queueContext && queueContext.type==='playlist' && queueContext.id===id){
            audio.pause(); currentIndex=-1; queue=[]; queueContext=null;
          }
          showToast('ลบเพลย์ลิสต์แล้ว');
          if(route.name==='playlist' && route.params.id===id) navigate('home');
          else render();
        }
      });
    });
  });

  // Shuffle / repeat toggles
  const shuffleBtn = document.getElementById('shuffleBtn');
  const repeatBtn = document.getElementById('repeatBtn');
  if(shuffleBtn) shuffleBtn.addEventListener('click', toggleShuffle);
  if(repeatBtn) repeatBtn.addEventListener('click', cycleRepeat);

  // Playlist detail: track rename + drag reorder
  if(route.name==='playlist'){
    document.querySelectorAll('#detailTrackList [data-rename-track]').forEach(el=>{
      el.addEventListener('click', (e)=>{ e.stopPropagation(); openRenameModal('track', Number(el.dataset.renameTrack)); });
    });
    bindPlaylistTracklistDnD(route.params.id);
  }

  // Backup export / import
  const exportBtn = document.getElementById('exportBtn');
  const importBtn = document.getElementById('importBtn');
  const importFileInput = document.getElementById('importFileInput');
  if(exportBtn) exportBtn.addEventListener('click', exportBackup);
  if(importBtn && importFileInput){
    importBtn.addEventListener('click', ()=>importFileInput.click());
    importFileInput.addEventListener('change', (e)=>{
      const file = e.target.files[0];
      if(file) importBackupFile(file);
      importFileInput.value = '';
    });
  }

  // Upload — local files
  const dropzone = document.getElementById('dropzone');
  const fileInput = document.getElementById('fileInput');
  if(dropzone){
    dropzone.addEventListener('click', ()=>fileInput.click());
    ['dragenter','dragover'].forEach(ev=>dropzone.addEventListener(ev,(e)=>{e.preventDefault();dropzone.classList.add('drag');}));
    ['dragleave','drop'].forEach(ev=>dropzone.addEventListener(ev,(e)=>{e.preventDefault();dropzone.classList.remove('drag');}));
    dropzone.addEventListener('drop', (e)=>handleFiles(Array.from(e.dataTransfer.files)));
    fileInput.addEventListener('change', (e)=>handleFiles(Array.from(e.target.files)).then(()=>fileInput.value=''));
  }

  // Upload — TikTok URL
  const tiktokFetchBtn = document.getElementById('tiktokFetchBtn');
  const tiktokUrlInput = document.getElementById('tiktokUrlInput');
  if(tiktokFetchBtn){
    tiktokFetchBtn.addEventListener('click', handleTiktokFetch);
    tiktokUrlInput.addEventListener('keydown', (e)=>{ if(e.key==='Enter') handleTiktokFetch(); });
  }
  const tiktokAddBtn = document.getElementById('tiktokAddBtn');
  if(tiktokAddBtn) tiktokAddBtn.addEventListener('click', handleTiktokAdd);

  // Create playlist
  const saveBtn = document.getElementById('saveNewPlaylist');
  if(saveBtn){
    saveBtn.addEventListener('click', async ()=>{
      const nameInput = document.getElementById('newPlaylistName');
      const name = nameInput.value.trim() || 'เพลย์ลิสต์ไม่มีชื่อ';
      const checked = Array.from(document.querySelectorAll('#view .check-row input:checked')).map(i=>Number(i.value));
      const pl = {name, trackIds:checked, createdAt:Date.now()};
      const id = await dbAdd('playlists', pl);
      pl.id = id;
      playlists.push(pl);
      showToast('สร้างเพลย์ลิสต์แล้ว');
      navigate('playlist', {id});
    });
  }

  // Playlist detail
  document.querySelectorAll('[data-play-playlist]').forEach(el=>{
    el.addEventListener('click', (e)=>{
      if(e.target.closest('.row-actions')) return;
      const pl = playlists.find(p=>p.id===route.params.id);
      const plTracks = pl.trackIds.map(tid=>tracks.find(t=>t.id===tid)).filter(Boolean);
      playQueue(plTracks, Number(el.dataset.playPlaylist), {type:'playlist', id:pl.id, name:pl.name});
    });
  });
  document.querySelectorAll('[data-remove-from-playlist]').forEach(el=>{
    el.addEventListener('click', async (e)=>{
      e.stopPropagation();
      const pl = playlists.find(p=>p.id===route.params.id);
      const tid = Number(el.dataset.removeFromPlaylist);
      pl.trackIds = pl.trackIds.filter(id=>id!==tid);
      await dbPut('playlists', pl);
      showToast('นำเพลงออกแล้ว');
      render();
    });
  });
  const addTracksBtn = document.getElementById('addTracksBtn');
  if(addTracksBtn) addTracksBtn.addEventListener('click', ()=>openAddTracksToPlaylistModal(route.params.id));

  // Cassette player controls
  const playBtn = document.getElementById('playBtn');
  if(playBtn){
    playBtn.addEventListener('click', ()=>{
      if(currentIndex===-1){
        if(route.name==='playlist'){
          const pl = playlists.find(p=>p.id===route.params.id);
          const plTracks = pl.trackIds.map(tid=>tracks.find(t=>t.id===tid)).filter(Boolean);
          if(plTracks.length) playQueue(plTracks, 0, {type:'playlist', id:pl.id, name:pl.name});
        }else if(route.name==='songs'){
          if(visibleSongs.length) playQueue(visibleSongs.slice(), 0, {type:'all', name: songSearchQuery ? 'ผลการค้นหา' : 'เพลงทั้งหมด'});
        }
        return;
      }
      togglePlay();
    });
    document.getElementById('prevBtn').addEventListener('click', ()=>skip(-1));
    document.getElementById('nextBtn').addEventListener('click', ()=>skip(1));
    document.getElementById('backBtn').addEventListener('click', ()=>seekBy(-10));
    document.getElementById('fwdBtn').addEventListener('click', ()=>seekBy(10));
    document.getElementById('seek').addEventListener('input', (e)=>{
      if(!isFinite(audio.duration)) return;
      audio.currentTime = (e.target.value/100)*audio.duration;
    });
    document.getElementById('volume').addEventListener('input', (e)=>{ audio.volume = Number(e.target.value); });
    setPlayingUI(!audio.paused && currentIndex>-1);
    updateTimeUI();
  }
}

async function handleFiles(files){
  if(!files.length) return;
  const added = [];
  for(const file of files){
    if(!file.type.startsWith('audio/')) continue;
    const track = {name:file.name.replace(/\.[^/.]+$/,''), artist:'', blob:file, addedAt:Date.now(), duration:null};
    const id = await dbAdd('tracks', track);
    track.id = id;
    tracks.push(track);
    added.push(track);
  }
  if(added.length){
    showToast(added.length>1 ? `เพิ่ม ${added.length} เพลงแล้ว` : 'เพิ่มเพลงแล้ว');
    prependRecentAdds(added);
  }
}

function prependRecentAdds(added){
  const box = document.getElementById('recentAdds');
  const list = document.getElementById('recentAddsList');
  if(box && list){
    box.style.display = 'block';
    list.innerHTML = added.map(t=>`
      <li class="song-row"><span class="song-num">♪</span><div class="song-info"><div class="song-name">${escapeHtml(t.name)}</div></div></li>
    `).join('') + list.innerHTML;
  }
}

/* ---- TikTok fetch/add handlers ---- */
async function handleTiktokFetch(){
  const input = document.getElementById('tiktokUrlInput');
  const statusEl = document.getElementById('tiktokStatus');
  const previewEl = document.getElementById('tiktokPreview');
  const fetchBtn = document.getElementById('tiktokFetchBtn');
  const url = input.value.trim();

  statusEl.classList.remove('error');
  previewEl.style.display = 'none';
  tiktokFetchedData = null;

  if(!url){
    statusEl.textContent = 'กรุณาวางลิงก์ TikTok ก่อน';
    statusEl.classList.add('error');
    return;
  }
  if(!/tiktok\.com/i.test(url)){
    statusEl.textContent = 'ลิงก์นี้ดูไม่ใช่ลิงก์ TikTok — ตรวจสอบอีกครั้ง';
    statusEl.classList.add('error');
    return;
  }

  fetchBtn.disabled = true;
  statusEl.textContent = 'กำลังดึงข้อมูล...';

  try{
    const data = await tiktokFetchInfo(url);
    tiktokFetchedData = data;
    document.getElementById('tiktokThumb').src = data.cover || data.origin_cover || '';
    document.getElementById('tiktokTitle').textContent = (data.title || 'ไม่มีชื่อ').slice(0,140);
    document.getElementById('tiktokAuthor').textContent = data.author ? '@'+data.author.unique_id : '';
    previewEl.style.display = 'flex';
    statusEl.textContent = 'ดึงข้อมูลสำเร็จ — กดเพิ่มเสียงเข้าคลังได้เลย';
  }catch(err){
    console.error(err);
    statusEl.textContent = 'เกิดข้อผิดพลาด: ' + err.message;
    statusEl.classList.add('error');
  }finally{
    fetchBtn.disabled = false;
  }
}

async function handleTiktokAdd(){
  if(!tiktokFetchedData) return;
  const statusEl = document.getElementById('tiktokStatus');
  const addBtn = document.getElementById('tiktokAddBtn');
  const data = tiktokFetchedData;

  // ใช้เสียงล้วน (music) ถ้ามี ไม่งั้น fallback เป็นวิดีโอ (ไม่มีลายน้ำ)
  const audioUrl = data.hdplay || data.play || data.music;
  if(!audioUrl){
    statusEl.textContent = 'ไม่พบไฟล์เสียงจากลิงก์นี้';
    statusEl.classList.add('error');
    return;
  }

  addBtn.disabled = true;
  statusEl.classList.remove('error');
  statusEl.textContent = 'กำลังดาวน์โหลดเสียง...';

  try{
    const blob = await urlToBlob(audioUrl);
    const name = (data.title && data.title.trim())
      ? data.title.trim().slice(0,80)
      : (data.author ? '@'+data.author.unique_id : 'TikTok Audio') + ' ' + Date.now();
    const artist = data.author && data.author.unique_id ? '@'+data.author.unique_id : (data.author && data.author.nickname ? data.author.nickname : '');
    const track = {name, artist, blob, addedAt:Date.now(), duration:null};
    const id = await dbAdd('tracks', track);
    track.id = id;
    tracks.push(track);

    showToast('เพิ่มเสียงจาก TikTok เข้าคลังแล้ว');
    prependRecentAdds([track]);
    statusEl.textContent = 'เพิ่มเข้าคลังแล้ว: ' + name;

    document.getElementById('tiktokPreview').style.display = 'none';
    document.getElementById('tiktokUrlInput').value = '';
    tiktokFetchedData = null;
  }catch(err){
    console.error(err);
    statusEl.textContent = 'เกิดข้อผิดพลาดระหว่างดาวน์โหลด: ' + err.message;
    statusEl.classList.add('error');
  }finally{
    addBtn.disabled = false;
  }
}
